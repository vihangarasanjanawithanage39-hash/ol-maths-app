name: Auto Unzip, Build 120Hz APK & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto Unzip app.zip
        run: |
          if [ -f "app.zip" ]; then
            unzip -o app.zip -d .
          else
            echo "app.zip not found!"
            exit 1
          fi

      - name: Inject Auto-Update Repo & Version
        run: |
          APP_VER="3.0.${{ github.run_number }}"
          sed -i "s|__APP_VERSION__|${APP_VER}|g" www/index.html
          sed -i "s|__GITHUB_REPO__|${{ github.repository }}|g" www/index.html
          echo "Injected Version: $APP_VER for ${{ github.repository }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install & Sync Capacitor
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Enable Native 120Hz
        run: npm run enable-120hz

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publish Auto-Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.${{ github.run_number }}
          name: O/L Maths A+ Master v3.0.${{ github.run_number }}
          body: "120Hz Ultra-Smooth Auto-Update Release"
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
