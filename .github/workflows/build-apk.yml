name: Auto Unzip, Build 120Hz Signed APK & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto Unzip app.zip
        run: |
          if [ -f "app.zip" ]; then
            unzip -o app.zip -d .
          else
            echo "app.zip not found!"
            exit 1
          fi

      - name: Inject Auto-Update Repo & Version
        run: |
          APP_VER="6.0.${{ github.run_number }}"
          sed -i "s|__APP_VERSION__|${APP_VER}|g" www/index.html
          sed -i "s|__GITHUB_REPO__|${{ github.repository }}|g" www/index.html

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install & Sync Capacitor
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Enable Native 120Hz & Custom Icon
        run: npm run enable-120hz

      - name: Build Unsigned Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign Release APK
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Publish Signed Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.0.${{ github.run_number }}
          name: O/L Maths A+ Master v6.0.${{ github.run_number }}
          body: "120Hz Signed Release APK"
          files: ${{ steps.sign_app.outputs.signedReleaseFile }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
